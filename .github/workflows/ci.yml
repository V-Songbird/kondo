name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # The jig guards. Standard-library node only — no install needed, and it
      # runs identically here and on a developer machine.
      - run: node .jig/checks/run.mjs
      # Both paired-change guards report themselves skipped above: they read the
      # git index and a CI checkout stages nothing. The selftest proves them
      # anyway, because a change-set fixture needs no index.
      - run: node .jig/checks/run.mjs --selftest

  # The built app, launched against the run-kondo fixture store and driven over
  # Chromium's debugging port (docs/testing.md, tier 5). Everything below the
  # seam is unit-tested above; this proves the seam: preload, IPC, renderer,
  # and one mutation round-tripping through all of them. Linux runners have no
  # display, so xvfb lends one; the sandbox is off there because the runner's
  # kernel refuses Chromium's.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run test:e2e
      - if: runner.os != 'Linux'
        run: npm run test:e2e
