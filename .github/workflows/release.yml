name: release

# A tag `v<version>` on main's tip produces one installer per OS — NSIS, DMG,
# AppImage — and attaches them to a DRAFT GitHub Release; publishing is a
# person's click (docs/release.md). The provenance job rejects any other tag
# before anything is packaged. The draft is made once, by a publish job
# that waits on all three, so a single OS failing yields no draft rather than an
# incomplete one. Artifacts are unsigned for now
# (docs/adr/0011-unsigned-releases-for-now.md): no identity is looked up and no
# certificate is read, so the workflow needs no secret beyond GITHUB_TOKEN.
#
# Before an installer is attached, the end-to-end smoke test drives the very
# installed Windows executable, Linux AppImage, or macOS app-bundle executable
# (KONDO_E2E_BINARY). macOS smoke does not mount the DMG or test Gatekeeper.
# The app must run fully offline
# (SECURITY.md); a release build that reaches the network is a blocker, and the
# smoke test runs against a fixture store with no network of any kind.

on:
  push:
    tags: ['v*']
  # Rehearsal. Run the whole pipeline from the Actions tab with no tag pushed:
  # everything builds and the smoke test runs, and the publish job stands down
  # because the run is not a tag push, even when dispatched on a tag ref
  # (docs/release.md).
  workflow_dispatch:

# Only the publish job below writes, and it says so itself.
permissions:
  contents: read

jobs:
  # A tag push must be the tip of origin/main, the reviewed candidate, and the
  # tag on origin must still point at this run's commit. The script fetches
  # main and the tag itself, through the token checkout persists, so the
  # checkout's depth and refs decide nothing. A rehearsal only reports the
  # comparison. What this does not prove: docs/release.md, "Tag provenance".
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verify-release-provenance.mjs

  package:
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: release/*.exe
          - os: macos-latest
            files: release/*.dmg
          - os: ubuntu-latest
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder must not go looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # A tag must name the version it ships, and it is cheaper to find out
      # here than after three OS builds. Rehearsal runs carry a branch name in
      # ref_name, so this only binds on a tag push.
      - if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name package.json version ${pkg}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The same lint and jig guards ci.yml runs — a tag must not ship what a
      # pull request would have been rejected for.
      - run: npm run lint
      - run: node .jig/checks/run.mjs
      - run: node .jig/checks/run.mjs --selftest
      - run: npm run build
      - run: npx electron-builder --publish never
      # Attribution is part of the artifact, so a notice missing from or stale
      # in the packaged resources fails the leg here — before the smoke, which
      # is the expensive part, and long before any installer is uploaded.
      # electron-builder suffixes the macOS directory with the architecture, so
      # the directory is discovered rather than fixed per OS, the same way the
      # macOS smoke below globs it (docs/release.md, "Packaging").
      - name: Verify the packaged third-party notices
        shell: bash
        run: |
          shopt -s nullglob
          directories=(release/win-unpacked/resources release/linux-unpacked/resources release/mac*/Kondo.app/Contents/Resources)
          if [ "${#directories[@]}" -ne 1 ]; then
            echo "Expected one packaged resources directory, found ${#directories[@]}" >&2
            exit 1
          fi
          node scripts/verify-packaged-notices.mjs "${directories[0]}"
      - name: Install NSIS and smoke the installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release/*.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          # Hosted runners are disposable: /D alone does not protect an existing
          # installation from NSIS's upgrade/uninstall logic. Never copy this
          # installation step to a developer account without checking its scope.
          $destination = Join-Path $env:RUNNER_TEMP "kondo-smoke-$([guid]::NewGuid())"
          # NSIS requires /D last, with no quotes around its value, even for spaces.
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList "/S /currentuser /D=$destination" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS failed with exit code $($installer.ExitCode)" }
          $env:KONDO_E2E_BINARY = Join-Path $destination 'Kondo.exe'
          if (-not (Test-Path -LiteralPath $env:KONDO_E2E_BINARY -PathType Leaf)) { throw 'Installed Kondo.exe is missing' }
          npm run test:e2e
      - name: Smoke the Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          images=(release/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected one AppImage, found ${#images[@]}" >&2
            exit 1
          fi
          chmod +x "${images[0]}"
          export KONDO_E2E_BINARY="$PWD/${images[0]}"
          sudo apt-get update
          sudo apt-get install -y xvfb
          # The harness prepends --appimage-extract-and-run for .AppImage binaries.
          xvfb-run -a npm run test:e2e
      - name: Smoke the macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          binaries=(release/mac*/Kondo.app/Contents/MacOS/Kondo)
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "Expected one macOS app executable, found ${#binaries[@]}" >&2
            exit 1
          fi
          test -x "${binaries[0]}"
          export KONDO_E2E_BINARY="$PWD/${binaries[0]}"
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  # One draft, made once, after all three legs have produced an installer. The
  # release step used to sit inside the matrix above, so a single OS failing
  # left a published draft missing that installer; now it yields no draft at
  # all. Skipped on a rehearsal: a workflow_dispatch on a tag ref also has
  # ref_type 'tag', so the event is checked too.
  publish:
    needs: [provenance, package]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      # Every download is unsigned (ADR-0011), so this file is the only
      # integrity signal a stranger gets. README's Install says how to use it.
      - name: Checksum the installers
        run: |
          cd installers
          sha256sum -- * | tee ../SHA256SUMS
          mv ../SHA256SUMS .
      # The tag's own CHANGELOG section becomes the release notes. Moving
      # entries out of [Unreleased] is a manual step (docs/release.md), so an
      # absent or empty section is a mistake worth stopping the release for.
      - name: Build the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'BEGIN{h="## [" v "]"} index($0,h)==1{f=1;next} f&&index($0,"## [")==1{f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entries under ## [${version}] — move them out of [Unreleased] before tagging" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            cat <<'INSTALL_NOTES'
          Artifacts: Windows x64 NSIS (`Kondo Setup <version>.exe`), macOS arm64 DMG (`Kondo-<version>-arm64.dmg`, Apple silicon only), Linux x64 AppImage (`Kondo-<version>.AppImage`). No Intel Mac or Windows/Linux ARM build is provided.

          Platform coverage: Windows x64 has recorded local fixture validation of the UI and installed NSIS app. macOS arm64 and Linux x64 have no recorded manual validation. Release CI requires packaged smoke checks before upload; a green run verifies the installed Windows app, Linux AppImage in extract-and-run mode, and macOS app bundle. DMG installation, Gatekeeper, and Linux FUSE mounting remain unverified.

          Unsigned build. Check your download against the SHA256SUMS asset and proceed only if you trust this release; see README, Install, for the full instructions and recorded Windows evidence.

          - Windows: run the installer. If SmartScreen shows an unknown publisher warning and offers it, choose "More info" → "Run anyway".
          - macOS: open the DMG and copy Kondo to Applications. Try opening it, then use System Settings → Privacy & Security → Open Anyway and confirm Open if the developer cannot be verified ([Apple instructions](https://support.apple.com/en-us/102445)). If a trusted download is still blocked by quarantine, `xattr -dr com.apple.quarantine "/Applications/Kondo.app"` removes that attribute recursively from this app bundle only; reopen Kondo. This does not sign or notarize the app. Do not override a malware warning.
          - Linux: run `chmod +x Kondo-*.AppImage`, then `./Kondo-<version>.AppImage` with the downloaded version substituted. For missing FUSE / `libfuse.so.2`, use `sudo apt install libfuse2` on Ubuntu 22.04 or `sudo apt install libfuse2t64` on Ubuntu 24.04; other distributions need their own FUSE 2 compatibility package ([AppImage guide](https://docs.appimage.org/user-guide/troubleshooting/fuse.html)).
          INSTALL_NOTES
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          # Sweeps in SHA256SUMS alongside the three installers.
          files: installers/*
          generate_release_notes: false
          body_path: notes.md
